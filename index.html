<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5a3e">
<meta name="description" content="Hamoula : transporteurs et expéditeurs de marchandises en Algérie. Trouvez un chargement pour votre retour.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Hamoula Transport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.gbtn{gap:12px;font-size:17px}
/* Layout : colonne mobile (max 480px), barre d'onglets fixe en bas, pages de détail en surcouche plein écran */
:root{
  --bg:#eef2ef; --surface:#ffffff; --surface2:#f4f7f5; --ink:#0f2a22; --muted:#55685f; --line:#d5e0da;
  --brand:#0b5a3e; --brand-ink:#ffffff; --dz-green:#006233; --dz-red:#d21034; --accent:#f0a20a; --accent-ink:#2a1b00; --accent-soft:#fdf0d4;
  --ok:#1d8352; --ok-soft:#e1f3ea; --warn:#a96400; --warn-soft:#fbefdc; --bad:#c23a2b; --bad-soft:#fbe5e2;
  --route-load:#e08a00; --route-trip:#2b6fa3; --land:#e2e8ee;
  --f-display:"Barlow Condensed","IBM Plex Sans Arabic","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --board:#0f1b26; --board-row:#152535; --board-ink:#f2efe6; --board-dim:#8ea3b5; --board-amber:#f4b13a; --board-green:#56cf8f; --board-line:#26394b;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08140f; --surface:#0f2019; --surface2:#142a21; --ink:#e4efe9; --muted:#8fa89c; --line:#22392f;
  --brand:#5fd0a0; --brand-ink:#06261a; --accent:#f4b13a; --accent-ink:#241600; --accent-soft:#3a2a0c;
  --ok:#4cc488; --ok-soft:#123326; --warn:#f0a640; --warn-soft:#3a2a10; --bad:#f06e5e; --bad-soft:#3b1a16;
  --route-load:#f4b13a; --route-trip:#6fb0e0; --land:#1a2d3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08140f; --surface:#0f2019; --surface2:#142a21; --ink:#e4efe9; --muted:#8fa89c; --line:#22392f;
  --brand:#5fd0a0; --brand-ink:#06261a; --accent:#f4b13a; --accent-ink:#241600; --accent-soft:#3a2a0c;
  --ok:#4cc488; --ok-soft:#123326; --warn:#f0a640; --warn-soft:#3a2a10; --bad:#f06e5e; --bad-soft:#3b1a16;
  --route-load:#f4b13a; --route-trip:#6fb0e0; --land:#1a2d3d; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
[dir="rtl"] body{font-family:"IBM Plex Sans Arabic",var(--f-body)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase}
.logo svg{flex:none}
.top .sp{flex:1}
.flag{border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.35);margin-inline-start:4px}
.dz-stripe{height:3px;background:linear-gradient(90deg,var(--dz-green) 0 50%,#fff 50% 100%)}
.sos-pill{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--bad);color:#fff;border-radius:999px;padding:5px 10px;font-weight:700;font-size:13px}
.pill-btn{border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;color:inherit}
.demo-tag{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 6px}

.banner{background:var(--accent-soft);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.banner .wrap{padding-block:8px;display:flex;gap:8px;align-items:flex-start}

h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
[dir="rtl"] .h1{text-transform:none;font-weight:700;font-size:26px}
.h2{font-size:18px;font-weight:600}
.lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .lbl{letter-spacing:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:12px;padding-block:18px 4px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* Bascule de rôle */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}

/* Grosses actions */
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:108px}
.big strong{font-size:16px;line-height:1.2}
.big span{font-size:13px;color:var(--muted)}
.big .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--warn)}
.big.trip .ic{background:color-mix(in srgb,var(--route-trip) 15%,transparent);color:var(--route-trip)}

/* Cartes d'annonces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:start;width:100%}
button.card:hover{border-color:var(--brand)}
.card-main{all:unset;display:flex;flex-direction:column;gap:8px;cursor:pointer;width:100%}
.card-main:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:6px}
.contact-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.contact-row .ph{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;flex:1;min-width:0;user-select:all}
.route{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;flex-wrap:wrap}
.route .arr{color:var(--muted);display:inline-block}
[dir="rtl"] .arr{transform:scaleX(-1)}
.kind-dot{width:10px;height:10px;border-radius:50%;flex:none}
.kind-dot.load{background:var(--route-load)} .kind-dot.trip{background:var(--route-trip)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
.price{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:6px;font-size:14px;min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)}
.b-acc{background:var(--accent);color:var(--accent-ink)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.stars{color:var(--accent);letter-spacing:1px}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 16px;font-weight:600;font-size:16px;min-height:48px}
.btn-p{background:var(--brand);color:var(--brand-ink)}
.btn-a{background:var(--accent);color:var(--accent-ink)}
.btn-o{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-d{background:var(--bad);color:#fff}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;padding:4px 0;font-size:14px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;min-height:48px;font-size:16px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--brand)}
.err{color:var(--bad);font-size:14px;font-weight:600}

/* Barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabs nav{max-width:456px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(6,30,20,.18);pointer-events:auto;overflow:hidden}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.tabs button[aria-current="page"]{color:var(--brand)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .pub-ic{width:40px;height:40px;margin-top:-6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.dot{position:absolute;top:6px;inset-inline-end:28%;width:9px;height:9px;border-radius:50%;background:var(--bad)}

/* Surcouche (pages de détail) */
.ov{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.ov-in{max-width:480px;margin:0 auto;padding-bottom:40px}
.ov-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line)}
.ov-head .wrap{display:flex;align-items:center;gap:8px;padding-block:8px}
.ov-head h2{font-size:17px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{border:0;background:transparent;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface2)}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* Modale */
.modal{position:fixed;inset:0;z-index:40;background:rgba(5,15,25,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow-y:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:min(90vw,440px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* Détails */
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

/* Suivi */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;inset-inline-start:13px;top:26px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--ok)}
.steps .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--muted);z-index:1}
.steps li.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.cur .n{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.steps .t{font-weight:600;padding-top:3px}
.steps .d{font-size:13px;color:var(--muted)}

/* Messages */
.conv-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:start}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;flex:none}
.chat{display:flex;flex-direction:column;gap:8px;padding-block:14px}
.msg{max-width:82%;padding:9px 12px;border-radius:14px;font-size:15px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.msg.sys{align-self:center;background:transparent;border:0;color:var(--muted);font-size:13px;text-align:center}
.msg .meta{font-size:11px;opacity:.75;margin-top:3px}
.offer{border:2px solid var(--accent);background:var(--accent-soft);color:var(--ink)}
.msg.me.offer{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.offer .p{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.composer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
.composer .wrap{display:flex;gap:8px;padding-block:10px}

/* Carte */
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:4px 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px}

.board{background:var(--board);color:var(--board-ink);border-radius:14px;overflow:hidden;border:1px solid var(--board-line)}
.board-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:2px solid var(--board-amber)}
.board-head .ttl{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.06em;text-transform:uppercase;color:var(--board-amber)}
.board-head .cols{display:flex;gap:14px;font-size:11px;color:var(--board-dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.axis{border-bottom:1px solid var(--board-line)}
.axis:last-child{border-bottom:0}
.axis-name{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.03em;text-transform:uppercase;padding:10px 14px 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
[dir="rtl"] .axis-name{text-transform:none;font-family:"IBM Plex Sans Arabic",sans-serif;font-size:18px}
.dir{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;width:100%;border:0;background:transparent;color:inherit;padding:8px 14px;text-align:start;font-size:15px}
.dir:hover{background:var(--board-row)}
.dir .to{color:var(--board-dim);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dir .to b{color:var(--board-ink);font-weight:600}
.cnt{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;min-width:44px;justify-content:flex-end}
.cnt.t{color:#8cc4ee} .cnt.l{color:var(--board-amber)} .cnt.z{color:var(--board-line)}
.ret{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--board);background:var(--board-green);border-radius:4px;padding:2px 6px}
.board-foot{padding:10px 14px;font-size:12px;color:var(--board-dim);border-top:1px solid var(--board-line)}
.vchip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.vchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.who-am-i{display:flex;flex-direction:column;gap:6px}
.times{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.times>div{display:flex;flex-direction:column;min-width:0}
.tm{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1}
.tline{height:2px;background:repeating-linear-gradient(90deg,var(--route-trip) 0 6px,transparent 6px 10px);min-width:20px}
.truck-ph{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px;border-radius:10px;background:var(--surface2);color:var(--route-trip)}
.photo-drop{display:flex;align-items:center;justify-content:center;min-height:150px;border:2px dashed var(--line);border-radius:12px;background:var(--surface2);cursor:pointer;overflow:hidden;text-align:center}
.photo-drop.bad{border-color:var(--bad)}
.photo-drop #p_ph{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px;color:var(--warn)}
.photo-drop #p_ph[hidden]{display:none}
.photo-drop img{width:100%;max-height:260px;object-fit:cover;display:block}
.load-top{display:flex;gap:12px;align-items:center}
.goods-th{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;max-width:100%}
.goods-th.ph,.goods-big.ph{display:grid;place-items:center;background:var(--accent-soft);color:var(--warn)}
.goods-big{width:100%;max-height:280px;object-fit:cover;border-radius:12px;display:block}
.goods-big.ph{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.side{display:flex;gap:12px;align-items:center;padding:10px;border:1.5px solid var(--line);border-radius:10px}
.side.ok{border-color:var(--ok);background:var(--ok-soft)}
.side-ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted);flex:none}
.side.ok .side-ic{background:var(--ok);color:#fff}
.end-panel{border-width:2px;border-color:var(--accent)}
.lock{background:var(--accent-soft);border-radius:8px;padding:8px 10px;border-top:0}
.lock-box{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1.5px dashed var(--accent);border-radius:10px;color:var(--warn)}
.lock-box strong{color:var(--ink)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:start;min-width:0;color:var(--ink)}
button.w{cursor:pointer}
.w .wl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
[dir="rtl"] .w .wl{letter-spacing:0}
.w .wn{font-family:var(--f-display);font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.w.span2{grid-column:span 2}
.w-hero{background:var(--brand);color:var(--brand-ink);border:0;position:relative;overflow:hidden}
.w-hero .wl{color:inherit;opacity:.8}
.w-hero::after{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:22px solid rgba(255,255,255,.08)}
.free-badge{align-self:flex-start;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.w-sos{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.w-sos .nums{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--bad)}
.w-map{background:var(--surface2)}
.w-map .mapart{height:46px;border-radius:10px;background:
  radial-gradient(circle at 20% 60%,var(--brand) 0 5px,transparent 6px),radial-gradient(circle at 80% 35%,var(--accent) 0 5px,transparent 6px),
  linear-gradient(160deg,transparent 46%,var(--route-trip) 46% 52%,transparent 52%),repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 12px),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 12px)}
.sponsor{border:1.5px solid var(--accent);background:linear-gradient(135deg,var(--accent-soft),var(--surface));border-radius:18px;padding:14px;display:flex;gap:12px;align-items:center}
.sponsor .sp-tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.sponsor .sp-logo{width:52px;height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--warn);flex:none}
.htable{width:100%;border-collapse:collapse;font-size:14px;min-width:340px}
.htable th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600}
.htable td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.htable tbody tr{cursor:pointer}.htable tbody tr:hover{background:var(--surface2)}
.htable .r{text-align:end;white-space:nowrap}
.htable tfoot td{font-weight:700;border-bottom:0;background:var(--surface2)}
.bell{position:relative;border:0;background:transparent;color:inherit;width:38px;height:38px;display:grid;place-items:center;border-radius:10px}
.bell-n{position:absolute;top:2px;inset-inline-end:2px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.alert-row,.notif{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface2)}
.notif{border-color:var(--accent);background:var(--accent-soft)}
.bl{border:2px solid var(--brand)}
.bl-ph{display:flex;flex-direction:column;gap:4px;min-width:0}
.bl-ph img{width:100%;height:120px;object-fit:cover;border-radius:10px}
.photo-drop.off{opacity:.45;cursor:not-allowed}
.sig{width:100%;height:140px;border:2px dashed var(--line);border-radius:12px;background:var(--surface2);touch-action:none;max-width:100%}
.sig-done img{width:100%;max-height:120px;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line)}
.ab{display:flex;flex-direction:column;gap:6px}
.ab-row{display:flex;gap:10px;align-items:flex-start}
.ab-pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.ab-pin.a{background:var(--brand);color:var(--brand-ink)}.ab-pin.b{background:var(--route-load);color:var(--accent-ink)}
.ab-line{width:2px;height:16px;margin-inline-start:14px;background:repeating-linear-gradient(180deg,var(--muted) 0 3px,transparent 3px 6px)}
.back-btn{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--surface2);color:var(--ink);border-radius:10px;padding:8px 12px 8px 8px;font-weight:600;font-size:15px;min-height:44px;flex:none}
.back-btn:hover{background:var(--line)}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.svc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px;font-weight:600;text-align:center;min-height:92px;justify-content:center}
.svc .ic{color:var(--brand)}
.sos-btn{background:var(--bad);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;width:100%}
.num-line{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.num-line b{font-size:22px;font-variant-numeric:tabular-nums;user-select:all}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);font-size:15px}
.star-pick{display:flex;gap:4px}
.star-pick button{border:0;background:none;font-size:34px;line-height:1;color:var(--line);padding:2px}
.star-pick button.on{color:var(--accent)}
.receipt{border:1.5px dashed var(--muted);border-radius:10px;padding:14px;font-size:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface2)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{inset-inline-start:25px}
.lang-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lang-row button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font-weight:600;font-size:14px}
.lang-row button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.lang-row button:disabled{opacity:.55}
.login{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-block:28px}
.login .hero{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.code-demo{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.role-pick{display:grid;gap:8px}
.role-pick button{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-weight:600;text-align:start}
.role-pick button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

let CARRIERS=[];
function profRating(p){return p&&p.ratingCount?Math.round(p.ratingSum/p.ratingCount*10)/10:0}
function carriersFor(l){const need=+l.weight||0;
  return CARRIERS.filter(c=>(c.zones||[]).includes(+l.from)&&(c.zones||[]).includes(+l.to)&&(!c.veh||(VEH.find(v=>v.k===c.veh)||{cap:99}).cap>=need)&&(l.body!=='frigo'||c.body==='frigo'))
   .sort((a,b)=>((b.base===+l.from)-(a.base===+l.from))||(b.rating-a.rating))}
function telLinks(phone){const n=(phone||'').replace(/\s/g,'');if(!n)return `<span class="small muted grow">${t('call_off')}</span>`;
  return `<span class="ph" dir="ltr">${ic('phone',16)} ${esc(phone)}</span><a class="btn btn-p btn-sm" href="tel:${n}">${t('call')}</a><a class="btn btn-o btn-sm" href="https://wa.me/213${n.replace(/^0/,'')}" target="_blank" rel="noopener">WhatsApp</a>`}
function carrierCard(c){
  return `<div class="card"><button class="card-main" onclick="A.open('carrier',{id:'${c.id}'})"><div class="row" style="justify-content:space-between"><div class="who"><span class="avatar" style="width:36px;height:36px">${esc((c.name||'?')[0])}</span><div><strong>${esc(c.name)}</strong><div class="small muted">${c.base?t('based')+' '+esc(W(c.base)):''}</div></div></div>${verifBadge(c.verified)}</div>
   <div class="chips">${c.veh?`<span class="chip">${esc(L(VEH,c.veh))}</span>`:''}${c.body?`<span class="chip">${esc(L(BODY,c.body))}</span>`:''}<span class="chip">${stars(c.rating)}</span><span class="chip num">${c.deliveries||0} ${t('deliveries')}</span></div>
   ${c.avail?`<div class="small">${ic('cal',15)} <strong>${t('avail')}</strong> ${esc(c.avail)}</div>`:''}
   ${(c.zones||[]).length?`<div class="small muted">${t('zones')} ${c.zones.map(W).map(esc).join(' · ')}</div>`:''}
   <span class="linkbtn">${t('see_profile')} ›</span></button>
   <div class="contact-row">${telLinks(c.allowCall?c.phone:'')}</div></div>`}
function carriersSection(l){const cs=carriersFor(l);
  return `<div class="lbl">${t('carriers_zone')} ${esc(W(l.from))} → ${esc(W(l.to))}</div>${cs.length?cs.map(carrierCard).join(''):`<div class="empty">${t('sugg_none')}</div>`}`}

// Re-rendu qui garde ce que l'utilisateur est en train de taper
function safeRender(){
  const top=ui.stack.at(-1);const sig=document.getElementById('sig');
  if(sig&&sig._dirty)return; // signature en cours
  if(!$('#modal').hidden)return;
  const vals={};document.querySelectorAll('#app input,#app select,#app textarea,#ov input,#ov select,#ov textarea').forEach(e=>{if(e.id&&e.type!=='file')vals[e.id]=e.type==='checkbox'?e.checked:e.value});
  const act=document.activeElement&&document.activeElement.id;const sel=act&&document.activeElement.selectionStart;
  const ovScroll=$('#ov').scrollTop,winScroll=window.scrollY;const chat=$('#chat');const atBottom=chat?($('#ov').scrollHeight-$('#ov').scrollTop-$('#ov').clientHeight<80):false;
  render();
  Object.entries(vals).forEach(([id,v])=>{const e=document.getElementById(id);if(!e)return;if(e.type==='checkbox')e.checked=v;else e.value=v});
  if(ui.photo){const p=$('#p_prev');if(p){p.src=ui.photo;p.hidden=false;const h=$('#p_ph');if(h)h.hidden=true}}
  if(top&&top.v==='convo'&&atBottom)$('#ov').scrollTop=$('#ov').scrollHeight;else $('#ov').scrollTop=ovScroll;
  window.scrollTo(0,winScroll);
  if(act){const e=document.getElementById(act);if(e){e.focus();try{if(sel!=null)e.setSelectionRange(sel,sel)}catch(_){}}}
}

// ---------- Couche données Firestore ----------
let unsubs=[],msgUnsub=null;
function stopListeners(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];if(msgUnsub){msgUnsub();msgUnsub=null}}
function mergePriv(l){const p=S.priv[l.id];if(!p)return l;Object.assign(l,{fromAddr:p.fromAddr,toAddr:p.toAddr,recvName:p.recvName,recvPhone:p.recvPhone});l.owner={...(l.owner||{}),phone:p.ownerPhone};return l}
function mapItem(d){const x={id:d.id,...d.data()};x.mine=x.ownerUid===uid();x.booked=!!x.status&&x.status!=='open';x.owner=x.owner||{name:'—'};return mergePriv(x)}
async function fetchPriv(id){if(S.priv[id])return;try{const s=await db.doc(`loads/${id}/private/contact`).get();if(s.exists){S.priv[id]=s.data();const l=S.loads.find(x=>x.id===id);if(l)mergePriv(l);safeRender()}}catch(e){console.warn('priv',id,e.code)}}
function startListeners(){
  stopListeners();const me=uid();let firstLoads=true;
  unsubs.push(db.collection('loads').where('date','>=',dOff(-3)).onSnapshot(q=>{
    const added=firstLoads?[]:q.docChanges().filter(c=>c.type==='added').map(c=>c.doc.id);
    S.loads=q.docs.map(mapItem).filter(x=>x.status!=='deleted');firstLoads=false;
    S.loads.filter(l=>l.mine||S.unlocked[l.id]).forEach(l=>fetchPriv(l.id));
    added.forEach(id=>{const l=S.loads.find(x=>x.id===id);if(l&&!l.mine&&notifyNewLoad(l))toast(t('notif_toast'))});
    safeRender()},fail));
  unsubs.push(db.collection('trips').where('date','>=',dOff(-3)).onSnapshot(q=>{S.trips=q.docs.map(mapItem).filter(x=>x.status!=='deleted');safeRender()},fail));
  unsubs.push(db.collection('convos').where('members','array-contains',me).onSnapshot(q=>{
    const old={};S.convos.forEach(c=>old[c.id]=c.msgs);
    S.convos=q.docs.map(d=>({id:d.id,...d.data(),msgs:old[d.id]||[]}));safeRender()},fail));
  unsubs.push(db.collection('bookings').where('members','array-contains',me).onSnapshot(q=>{S.bookings=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));safeRender()},fail));
  unsubs.push(db.collection('publicProfiles').where('isTrans','==',true).onSnapshot(q=>{
    CARRIERS=q.docs.filter(d=>d.id!==me).map(d=>{const p=d.data();return {id:d.id,...p,rating:profRating(p)}});safeRender()},fail));
  unsubs.push(db.doc('publicProfiles/'+me).onSnapshot(s=>{S.myProfile=s.exists?s.data():null},()=>{}));
  unsubs.push(db.collection('unlocks').where('uid','==',me).onSnapshot(q=>{q.docs.forEach(d=>{const id=d.data().loadId;if(!S.unlocked[id]){S.unlocked[id]=true;fetchPriv(id)}});safeRender()},fail));
  unsubs.push(db.doc('users/'+me).onSnapshot(s=>{if(s.exists){applyUser(s.data());safeRender()}},()=>{}));
}
function applyUser(d){Object.assign(S.user,{name:d.name||'',phone:d.phone||'',roles:d.roles||['client'],verif:d.verif||'pending',status:d.status||'active',suspendedUntil:d.suspendedUntil||0,sanctionMsg:d.sanctionMsg||'',allowCall:d.allowCall!==false,vehicles:d.vehicles||[],docs:d.docs||{},zones:d.zones||[],base:d.base||null,avail:d.avail||''});
  S.alerts=d.alerts||[];if(!S.user.roles.includes(S.user.active))S.user.active=S.user.roles.includes('trans')?'trans':'client'}
function ownerObj(){const p=S.myProfile;return {name:S.user.name,verified:S.user.verif==='ok',rating:profRating(p),deliveries:(p&&p.deliveries)||0,allowCall:S.user.allowCall}}
function profileFrom(u){const v=(u.vehicles||[])[0]||{};return {name:u.name,isTrans:(u.roles||[]).includes('trans'),base:u.base||null,zones:u.zones||[],veh:v.veh||'',body:v.body||'',phone:u.allowCall?u.phone:'',allowCall:!!u.allowCall,avail:u.avail||''}}
function syncProfile(){return db.doc('publicProfiles/'+uid()).set(profileFrom(S.user),{merge:true}).catch(fail)}
function saveUser(patch){return db.doc('users/'+uid()).update(patch).catch(fail)}

auth.onAuthStateChanged(async u=>{
  stopListeners();
  if(!u){S.user.logged=false;S.user.uid=null;ui.loginStep='google';render();return}
  S.user.uid=u.uid;
  try{const snap=await db.doc('users/'+u.uid).get();
    if(!snap.exists){ui.loginStep='name';ui.gname=u.displayName||'';S.user.logged=false;render();return}
    applyUser(snap.data());S.user.logged=true;startListeners();ui.tab='home';render();
  }catch(e){fail(e);ui.loginStep='google';render()}
});

// ---------- Mise en relation ----------
function matchScore(load,trip){
  let s=0;const why=[];const route=[trip.from,...(trip.stops||[]),trip.to];
  const iF=route.indexOf(+load.from), iT=route.indexOf(+load.to);
  if(+load.from===+trip.from){s+=35;why.push('m_from')}else if(iF>=0){s+=22;why.push('m_stop')}
  if(+load.to===+trip.to){s+=35;why.push('m_to')}else if(iT>0&&iT>iF){s+=22;if(!why.includes('m_stop'))why.push('m_stop')}
  if(iF<0||iT<0||iT<=iF) s-=40;
  const dd=Math.abs(days(load.date,trip.date));
  if(dd<=1){s+=15;why.push('m_date')}else if(dd<=3)s+=7;else s-=10;
  if(+load.weight<=+trip.capFree){s+=10;why.push('m_cap')}else s-=40;
  if(load.body&&load.body===trip.body){s+=5;why.push('m_body')}else if(load.body==='frigo'&&trip.body!=='frigo')s-=40;
  return {s:Math.max(0,Math.min(100,s)),why};
}
// Trajet retour virtuel : arrivée → départ, le lendemain, capacité totale libérée
function returnTrip(tr){return {from:tr.to,to:tr.from,stops:[...(tr.stops||[])].reverse(),date:dOff(days(tr.date,dOff(0))+1),capFree:tr.capTotal,body:tr.body}}
function returnMatches(tr){return S.loads.filter(l=>!l.mine&&!l.booked).map(l=>({l,m:matchScore(l,returnTrip(tr))})).filter(x=>x.m.s>=50).sort((a,b)=>b.m.s-a.m.s)}
function tripMatchesForLoad(l){return S.trips.filter(tr=>!tr.mine).map(tr=>({tr,m:matchScore(l,tr)})).filter(x=>x.m.s>=50).sort((a,b)=>b.m.s-a.m.s)}
function loadMatchesForTrip(tr){return S.loads.filter(l=>!l.mine&&!l.booked).map(l=>({l,m:matchScore(l,tr)})).filter(x=>x.m.s>=50).sort((a,b)=>b.m.s-a.m.s)}

// Carte schématique (projection équirectangulaire simple)
const PX=lng=>(lng+9)*20, PY=lat=>(37.6-lat)*20;
const OUTLINE=[[35.1,-2.2],[35.8,-0.8],[36.1,0.5],[36.6,2],[36.8,3.1],[36.9,5],[37,6.5],[36.95,8.6],[36.4,8.3],[35.2,8.3],[34.2,7.6],[33.2,7.8],[32.1,9.1],[30.2,9.5],[28,9.9],[26.4,10],[24.2,10.2],[23.5,11.9],[21.6,8],[19.6,5.8],[19.1,4.2],[19,3.3],[19.8,1.3],[21,-0.9],[22.2,-2.4],[25,-4.8],[25,-6.6],[26.1,-8.7],[27.7,-8.7],[28.8,-8.1],[29.6,-7],[30,-5.6],[31.4,-3.7],[32.1,-2.9],[32.1,-1.2],[33,-1.5],[34,-1.7]];
function mapSVG(items,h){
  const pts=OUTLINE.map(([a,b])=>`${PX(b).toFixed(1)},${PY(a).toFixed(1)}`).join(' ');
  const used=new Set();
  const lines=items.map(it=>{const f=WIL.find(w=>w[0]==it.from),to=WIL.find(w=>w[0]==it.to);if(!f||!to)return '';used.add(f[0]);used.add(to[0]);
    const c=it.kind==='load'?'var(--route-load)':'var(--route-trip)';const dash=it.kind==='load'?'stroke-dasharray="6 4"':'';
    return `<line x1="${PX(f[4])}" y1="${PY(f[3])}" x2="${PX(to[4])}" y2="${PY(to[3])}" stroke="${c}" stroke-width="3" stroke-linecap="round" ${dash} opacity=".9"/>`}).join('');
  const dots=WIL.map(w=>`<circle cx="${PX(w[4])}" cy="${PY(w[3])}" r="${used.has(w[0])?4.5:2}" fill="${used.has(w[0])?'var(--ink)':'var(--muted)'}" opacity="${used.has(w[0])?1:.55}"><title>${esc(W(w[0]))}</title></circle>`).join('');
  const labels=[...used].map(c=>{const w=WIL.find(x=>x[0]==c);return `<text x="${PX(w[4])+6}" y="${PY(w[3])-5}" font-size="11" font-weight="600" fill="var(--ink)" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${esc(W(c))}</text>`}).join('');
  return `<div class="mapbox"><svg viewBox="${h?'-20 -6 490 120':'-20 -6 490 390'}" role="img" aria-label="${t('map')}"><polygon points="${pts}" fill="var(--land)" stroke="var(--line)" stroke-width="1.5"/>${dots}${lines}${labels}</svg>
  <div class="legend"><span><i style="background:var(--route-trip)"></i>${t('trips')}</span><span><i style="background:repeating-linear-gradient(90deg,var(--route-load) 0 6px,transparent 6px 10px)"></i>${t('loads')}</span></div>
  <div class="small muted" style="padding:0 6px 4px">${t('map_note')}</div></div>`;
}

// Tableau des axes : regroupe annonces et trajets par paire de wilayas, dans les deux sens
function axesBoard(limit=6){
  const ax={};
  const add=(it,kind)=>{const a=Math.min(it.from,it.to),b=Math.max(it.from,it.to);const k=a+'-'+b;
    ax[k]=ax[k]||{a,b,ab:{t:0,l:0},ba:{t:0,l:0}};const d=it.from===a?'ab':'ba';ax[k][d][kind]++;};
  S.trips.filter(x=>!x.mine).forEach(x=>add(x,'t'));S.loads.filter(x=>!x.mine&&!x.booked).forEach(x=>add(x,'l'));
  const list=Object.values(ax).map(x=>({...x,n:x.ab.t+x.ab.l+x.ba.t+x.ba.l})).sort((p,q)=>q.n-p.n).slice(0,limit);
  const c=(n,cls,icn)=>`<span class="cnt ${n?cls:'z'}">${ic(icn,16)}${n}</span>`;
  const dir=(from,to,d,other)=>{const ret=d.l>0&&other.t>0;
    return `<button class="dir" onclick="A.axis(${from},${to})"><span class="to">${ARROW} <b>${esc(W(to))}</b> ${ret?`<span class="ret">${t('ax_ret')}</span>`:''}</span>${c(d.t,'t','truck')}${c(d.l,'l','box')}</button>`};
  return `<div class="board"><div class="board-head"><span class="ttl">${t('ax_title')}</span><span class="cols"><span>${t('trips')}</span><span>${t('loads')}</span></span></div>
   ${list.length?list.map(x=>`<div class="axis"><div class="axis-name">${esc(W(x.a))} <span style="color:var(--board-amber)">⇄</span> ${esc(W(x.b))}</div>${dir(x.a,x.b,x.ab,x.ba)}${dir(x.b,x.a,x.ba,x.ab)}</div>`).join(''):`<div class="board-foot">${t('none')}</div>`}
   <div class="board-foot">${t('ax_foot')}</div></div>`;
}

function vehChips(sel){return `<div class="chips" role="group" aria-label="${t('vehicle')}">`+[{k:'',fr:t('any'),ar:t('any')},...VEH].map(v=>`<button class="vchip" aria-pressed="${(sel||'')===v.k}" onclick="A.hd('veh','${v.k}')">${esc(v.k?(S.lang==='ar'?v.ar:v.fr):t('any'))}</button>`).join('')+`</div>`}
function onRoute(tr,from,to){const r=[tr.from,...(tr.stops||[]),tr.to];const i=from?r.indexOf(+from):0,j=to?r.indexOf(+to):r.length-1;return i>=0&&j>=0&&j>i}

function mapsUrl(from,to){const n=c=>{const w=WIL.find(x=>x[0]==c);return encodeURIComponent((w?w[1]:'')+', Algérie')};

  if(from)return `https://www.google.com/maps/search/?api=1&query=${n(from)}`;return 'https://www.google.com/maps/@28.0,2.6,5z'}
function sponsorCard(i=0){const sp=[{n:t('sp1_n'),d:t('sp1_d'),i:'fuel'},{n:t('sp2_n'),d:t('sp2_d'),i:'wrench'},{n:t('sp3_n'),d:t('sp3_d'),i:'shield'}][i%3];

// Distance routière estimée : distance à vol d'oiseau entre chefs-lieux × 1,3 (à remplacer par l'API Google Directions)
function compressImg(file,cb){const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const m=720,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72))};img.src=r.result};r.readAsDataURL(file)}

function alertsList(){S.alerts=S.alerts||[];const auto=S.trips.filter(x=>x.mine&&x.retour).map(x=>({id:'auto-'+x.id,from:x.to,to:x.from,auto:true,trip:x.id}));return [...auto,...S.alerts]}
function loadMatchesAlert(l,a){return !l.mine&&!l.booked&&(!a.from||+l.from===+a.from)&&(!a.to||+l.to===+a.to)&&(!a.veh||!l.veh||l.veh===a.veh)}
function notifyNewLoad(l){S.notifs=S.notifs||[];const hit=alertsList().find(a=>loadMatchesAlert(l,a));if(!hit)return false;
  S.notifs.unshift({id:'N'+Date.now()+Math.random().toString(36).slice(2,6),load:l.id,alert:hit.auto?'auto':'custom',ts:Date.now(),read:false});persist();return true}
const unreadN=()=>(S.notifs||[]).filter(n=>!n.read).length;
function km(a,b){const A=WIL.find(x=>x[0]==a),B=WIL.find(x=>x[0]==b);if(!A||!B)return 0;const r=Math.PI/180,
  d=2*6371*Math.asin(Math.sqrt(Math.sin((B[3]-A[3])*r/2)**2+Math.cos(A[3]*r)*Math.cos(B[3]*r)*Math.sin((B[4]-A[4])*r/2)**2));return Math.max(10,Math.round(d*1.3/5)*5)}
const fkm=n=>new Intl.NumberFormat('fr-DZ').format(n)+' km';
const iCarrier=b=>b.carrierUid===uid();

function opts(arr,sel,any=true){return (any?`<option value="">${t('any')}</option>`:'')+arr.map(o=>`<option value="${o.k}" ${sel===o.k?'selected':''}>${esc(S.lang==='ar'?o.ar:o.fr)}</option>`).join('')}

// ---------- Détail d'annonce ----------
function detailView(p){
  const it=getItem(p.kind,p.id);if(!it)return `<div class="wrap empty" style="margin-top:16px">—</div>`;
  const isL=p.kind==='load';const o=it.owner;
  const rows=isL?[[t('date'),fdate(it.date)],[t('from'),W(it.from)+(it.fromCity?' · '+it.fromCity:'')],[t('to'),W(it.to)+(it.toCity?' · '+it.toCity:'')],[t('goods'),L(GOODS,it.goods)],[t('weight'),tn(it.weight)],[t('volume'),it.volume?it.volume+' m³':'—'],[t('dims'),it.dims||'—'],[t('vehicle'),it.veh?L(VEH,it.veh):'—'],[t('body'),it.body?L(BODY,it.body):'—'],[t('notes'),it.notes||'—']]
   :[[t('date'),fdate(it.date)],[t('dep_time'),(it.depTime||'—')+(it.fromCity?' · '+it.fromCity:'')],[t('arr_time'),(it.arrTime||'—')+(it.toCity?' · '+it.toCity:'')],[t('stops'),(it.stops||[]).map(W).join(' · ')||'—'],[t('vehicle'),L(VEH,it.veh)],[t('body'),L(BODY,it.body)],[t('cap_total'),tn(it.capTotal)],[t('cap_free'),tn(it.capFree)],[t('return_ok'),it.retour?'✓':'—']];
  // compatibilité avec mes propres annonces
  let mHTML='';
  if(!it.mine){
    const mine=isL?S.trips.filter(x=>x.mine):S.loads.filter(x=>x.mine);
    const best=mine.map(m=>({m,r:isL?(m.retour?Math.max(matchScore(it,m).s,matchScore(it,returnTrip(m)).s):matchScore(it,m).s):matchScore(m,it).s,why:isL?matchScore(it,m.retour&&matchScore(it,returnTrip(m)).s>matchScore(it,m).s?returnTrip(m):m).why:matchScore(m,it).why})).sort((a,b)=>b.r-a.r)[0];
    if(best&&best.r>0) mHTML=`<div class="panel"><div class="row" style="justify-content:space-between"><span class="lbl">${t('match')}</span><span class="score" style="font-size:22px">${best.r}%</span></div>
      <div class="bar"><i style="width:${best.r}%"></i></div><div class="chips">${best.why.map(w=>`<span class="chip">✓ ${t(w)}</span>`).join('')}</div><div class="small muted">${t('match_note')}</div></div>`;
  }
  let mineHTML='';
  if(it.mine){
    const ms=isL?tripMatchesForLoad(it):[...loadMatchesForTrip(it),...(it.retour?returnMatches(it):[])];
    mineHTML=`<section class="sec"><h2 class="h2">${isL?t('sugg_trans'):t('matches_after')}</h2>${isL?`<div class="lbl">${t('trips_planned')}</div>`:''}${ms.length?ms.slice(0,5).map(x=>isL?tripCard(x.tr,x.m):loadCard(x.l,x.m)).join(''):`<div class="empty">${isL?t('no_trip_yet'):t('ret_none')}</div>`}${isL?carriersSection(it):''}<div class="small muted">${t('match_note')}</div>
      ${!isL?`<div class="actions"><button class="btn btn-o" onclick="A.capModal('${it.id}')">${t('edit_cap')}</button><button class="btn btn-p" onclick="A.full('${it.id}')">${t('mark_full')}</button></div>`:''}
      <button class="btn btn-o btn-block" onclick="A.del('${p.kind}','${it.id}')">${t('delete')}</button></section>`;
  }
  return `<div class="wrap stack" style="padding-block:16px">
    <div class="row" style="justify-content:space-between"><span class="badge ${isL?'b-acc':'b-ok'}">${isL?t('loads'):t('trips')}</span>${it.mine?`<span class="badge b-acc">${t('mine')}</span>`:''}</div>
    <div class="h1" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${esc(W(it.from))} ${ARROW} ${esc(W(it.to))}</div>
    <div class="row" style="justify-content:space-between"><div class="price" style="font-size:26px">${money(it.price)}</div><a class="btn btn-o btn-sm" href="${mapsUrl(it.from,it.to)}" target="_blank" rel="noopener">${ic('pin',16)} ${t('see_maps')}</a></div>
    ${isL?`<figure style="margin:0">${goodsThumb(it,true)}<figcaption class="small muted" style="margin-top:4px">${it.photoTs?`${t('photo_taken')} ${ftime(it.photoTs)} · `:''}${t('photo_proof')}</figcaption></figure>`:''}
    ${mHTML}
    ${isL&&it.mine&&(it.fromAddr||it.toAddr)?`<div class="panel">${addrBlock(it)}</div>`:''}
    <div class="panel"><dl class="kv">${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl></div>
    ${!it.mine&&isLocked(p.kind,it)?`<div class="panel lock-panel"><span class="lbl">${t('posted_by')}</span>
      <div class="row"><span class="avatar">${esc(o.name[0])}</span><div class="grow"><strong>${esc(maskName(o.name))}</strong><div class="small">${stars(o.rating)} · <span class="num">${o.deliveries}</span> ${t('deliveries')}</div></div>${verifBadge(o.verified)}</div>
      <div class="lock-box">${ic('flag',18)}<div><strong>${t('locked')}</strong><div class="small muted">${t('locked_d')}</div></div></div>
      <button class="btn btn-a btn-block" style="font-size:18px" onclick="A.unlockStart('${it.id}')">${t('accept_course')} · ${FREE_MODE?t('free_word'):money(FEE)}</button>
      <div class="small muted">${FREE_MODE?t('free_note'):t('fee_note')}</div></div>`:''}
    ${!it.mine&&!isLocked(p.kind,it)?`<div class="panel"><span class="lbl">${t('posted_by')}</span>
      <div class="row"><span class="avatar">${esc(o.name[0])}</span><div class="grow"><strong>${esc(o.name)}</strong><div class="small">${stars(o.rating)} · <span class="num">${o.deliveries}</span> ${t('deliveries')}</div></div>${verifBadge(o.verified)}</div>
      <span class="lbl">${t('contact')}</span>${p.kind==='load'?`<div class="badge b-ok">${ic('check',13)} ${t('unlocked')}</div>${addrBlock(it)}`:''}
      ${o.allowCall?`<div class="num-line"><b dir="ltr">${esc(o.phone)}</b><button class="btn btn-o btn-sm" onclick="A.copy('${esc(o.phone)}')">${t('copy')}</button></div>
      <div class="actions"><a class="btn btn-p" href="tel:${o.phone.replace(/\s/g,'')}">${ic('phone',20)} ${t('call')}</a><a class="btn btn-o" href="https://wa.me/213${o.phone.replace(/\s/g,'').slice(1)}" target="_blank" rel="noopener">${ic('msg',20)} WhatsApp</a></div>`
      :`<div class="small muted">${t('call_off')}</div>`}
      <button class="btn btn-o btn-block" onclick="A.startConvo('${p.kind}','${it.id}')">${ic('msg',20)} ${t('message')} (Hamoula)</button></div>
      <button class="btn btn-a btn-block" onclick="A.offerModal('${p.kind}','${it.id}')">${t('offer')}</button>
      <button class="linkbtn" style="color:var(--bad);align-self:flex-start" onclick="A.reportModal()">${ic('flag',16)} ${t('report')}</button>`:''}
  </div>${mineHTML?`<div class="wrap">${mineHTML}</div>`:''}`;
}

// ---------- Historique & clients ----------
function activity(){const done=S.bookings.filter(b=>b.step===5);const all=S.bookings;
  return {done,all,km:done.reduce((a,b)=>a+km(b.snap.from,b.snap.to),0),money:done.reduce((a,b)=>a+b.price,0),clients:clientsList().length}}
function clientsList(){const m={};S.bookings.forEach(b=>{const n=partnerName(b);if(!n||n==='—')return;const c=m[n]=m[n]||{name:n,phone:partnerPhone(b),n:0,km:0,money:0,last:'',rating:[]};
  c.n++;c.km+=km(b.snap.from,b.snap.to);c.money+=b.price;if(b.snap.date>c.last)c.last=b.snap.date;if(!c.phone)c.phone=partnerPhone(b)});
  return Object.values(m).sort((a,b)=>b.n-a.n||b.last.localeCompare(a.last))}
function activityWidgets(){const a=activity();
  return `<div class="bento">
   <button class="w" onclick="A.open('history')"><span class="wl">${t('h_courses')}</span><span class="wn">${a.done.length}</span><span class="small muted">${t('h_done')}</span></button>
   <button class="w" onclick="A.open('history')"><span class="wl">${t('h_km')}</span><span class="wn">${new Intl.NumberFormat('fr-DZ').format(a.km)}</span><span class="small muted">${t('h_km_d')}</span></button>
   <button class="w" onclick="A.open('clients')"><span class="wl">${isTrans()?t('h_clients'):t('h_carriers')}</span><span class="wn">${a.clients}</span><span class="small muted">${t('h_see_list')}</span></button>
   <button class="w" onclick="A.open('history')"><span class="wl">${t('h_total')}</span><span class="wn" style="font-size:26px">${money(a.money)}</span><span class="small muted">${t('h_total_d')}</span></button>
  </div>`}

    ${receipt}${rateHTML}

  ov.innerHTML=`<div class="ov-in"><div class="ov-head"><div class="wrap"><button class="back-btn" onclick="A.back()" aria-label="${t('back')}">${ic('back',22,'flip-rtl')}<span>${t('back')}</span></button><h2>${esc(title?t(title):top._t)}</h2></div></div>${views[top.v](top.p)}</div>`;

function initSig(){const c=document.getElementById('sig');if(!c||c._ok)return;c._ok=true;const x=c.getContext('2d');x.lineWidth=3;x.lineCap='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink')||'#000';let d=false;c._dirty=false;
  const pos=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.addEventListener('pointerdown',e=>{d=true;c.setPointerCapture(e.pointerId);const [a,b]=pos(e);x.beginPath();x.moveTo(a,b)});
  c.addEventListener('pointermove',e=>{if(!d)return;const [a,b]=pos(e);x.lineTo(a,b);x.stroke();c._dirty=true});
  ['pointerup','pointercancel'].forEach(ev=>c.addEventListener(ev,()=>d=false))}

  // ---- Étapes de la course ----
  async validate(bid){const me=uid();const b0=S.bookings.find(x=>x.id===bid);const carrier=b0.carrierUid===me;
    if(carrier&&!(b0.bl&&b0.bl.sig&&b0.bl.photoDel)){toast(t('bl_required'));const e=document.querySelector('.bl');if(e)e.scrollIntoView({behavior:'smooth'});return}
    try{const done=await db.runTransaction(async tx=>{const ref=db.doc('bookings/'+bid);const s=await tx.get(ref);const b=s.data();const now=NOW();const up={};
      if(carrier){up.okT=now;if(b.step<4){up.step=4;up['hist.4']=now}}else up.okC=now;
      const okT=carrier?now:b.okT,okC=carrier?b.okC:now;
      if(okT&&okC){up.step=5;up['hist.5']=now;up.gps=false}
      tx.update(ref,up);return !!(okT&&okC)});
      if(done){toast(t('end_done'));if(ui.gps[bid]!=null)A.gpsStop(bid);
        const b=S.bookings.find(x=>x.id===bid);[b.carrierUid,b.shipperUid].forEach(u=>db.doc('publicProfiles/'+u).update({deliveries:FV.increment(1)}).catch(()=>{}))}
      else toast(t('end_saved'))}catch(e){fail(e)}},
  advance(bid){const b=S.bookings.find(x=>x.id===bid);if(b.step>=3)return;const n=b.step+1;
    db.doc('bookings/'+bid).update({step:n,['hist.'+n]:NOW()}).then(()=>toast(t('s'+n))).catch(fail)},
  pickStar(n){A._star=n;document.querySelectorAll('#sp button').forEach((e,i)=>e.classList.toggle('on',i<n))},
  async rate(bid){if(!A._star)return;const b=S.bookings.find(x=>x.id===bid);const me=uid();const other=b.members.find(x=>x!==me);const r=A._star;A._star=0;
    try{await db.doc('bookings/'+bid).update({['ratingBy.'+me]:{r,c:$('#rc').value.trim(),ts:NOW()}});
      await db.doc('publicProfiles/'+other).update({ratingSum:FV.increment(r),ratingCount:FV.increment(1)});toast(t('thanks'))}catch(e){fail(e)}},
  // ---- Profil ----
  vehModal(){modal(`<div class="h2">${t('add_vehicle')}</div>
    <div class="field"><label for="vv">${t('vehicle')}</label><select id="vv">${opts(VEH,'v19',false)}</select></div>
    <div class="field"><label for="vb">${t('body')}</label><select id="vb">${opts(BODY,'bache',false)}</select></div>
    <div class="grid2"><div class="field"><label for="vc">${t('cap_total')}</label><input id="vc" type="number" min="1" inputmode="decimal" value="19"></div><div class="field"><label for="vp">${t('plate')}</label><input id="vp" type="text" dir="ltr" placeholder="00123 118 16"></div></div>
    <div class="actions"><button class="btn btn-o" onclick="A.closeModal()">${t('cancel')}</button><button class="btn btn-p" onclick="A.addVeh()">${t('save')}</button></div>`)},
  addVeh(){const v={id:'V'+NOW(),veh:$('#vv').value,body:$('#vb').value,cap:+$('#vc').value||0,plate:$('#vp').value.trim()};S.user.vehicles=[...S.user.vehicles,v];A.closeModal();saveUser({vehicles:S.user.vehicles}).then(syncProfile);render()},
  delVeh(id){S.user.vehicles=S.user.vehicles.filter(v=>v.id!==id);saveUser({vehicles:S.user.vehicles}).then(syncProfile);render()},
  carrierModal(){const u=S.user;modal(`<div class="h2">${t('my_card')}</div><div class="small muted">${t('my_card_d')}</div>
    <div class="field"><label for="cm_base">${t('based')}</label><select id="cm_base">${wilOpts(u.base,false)}</select></div>
    <div class="field"><label for="cm_zones">${t('zones')}</label><select id="cm_zones" multiple size="8" style="min-height:180px">${[...WIL].map(w=>`<option value="${w[0]}" ${(u.zones||[]).includes(w[0])?'selected':''}>${String(w[0]).padStart(2,'0')} · ${esc(S.lang==='ar'?w[2]:w[1])}</option>`).join('')}</select><span class="hint">${t('multi_hint')}</span></div>
    <div class="field"><label for="cm_av">${t('avail')}</label><input id="cm_av" type="text" value="${esc(u.avail)}" placeholder="${t('avail_ph')}"></div>
    <div class="actions"><button class="btn btn-o" onclick="A.closeModal()">${t('cancel')}</button><button class="btn btn-p" onclick="A.saveCarrier()">${t('save')}</button></div>`)},
  saveCarrier(){const base=+$('#cm_base').value||null;let zones=[...$('#cm_zones').selectedOptions].map(o=>+o.value);if(base&&!zones.includes(base))zones.unshift(base);
    const avail=$('#cm_av').value.trim();Object.assign(S.user,{base,zones,avail});A.closeModal();saveUser({base,zones,avail}).then(syncProfile).then(()=>toast(t('saved')));render()},
  toggleCall(){S.user.allowCall=!S.user.allowCall;saveUser({allowCall:S.user.allowCall}).then(syncProfile);render()},
  doc(k,inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type)){toast(t('img_only'));return}
    compressImg(f,u=>{db.doc(`users/${uid()}/private/docs`).set({[k]:{name:f.name,data:u,ts:NOW()}},{merge:true})
      .then(()=>saveUser({['docs.'+k]:{name:f.name,status:'pending',ts:NOW()}})).then(()=>toast(t('uploaded'))).catch(fail)})},
  closeModal(){const m=$('#modal');if(m.hidden)return;m.hidden=true;m.innerHTML='';if(ui.hModal){ui.hModal=false;ui.pendingBack=true;setTimeout(()=>{if(ui.pendingBack){ui.pendingBack=false;ui.skipPop=true;history.back()}},0)}}
};
function hPush(st){try{if(ui.pendingBack){ui.pendingBack=false;history.replaceState(st,'')}else history.pushState(st,'')}catch(e){}}
// Touche « retour » du téléphone : ferme la fenêtre ou revient à l'écran précédent au lieu de quitter l'app
window.addEventListener('popstate',()=>{
  if(ui.skipPop){ui.skipPop=false;return}
  const m=$('#modal');if(!m.hidden){ui.hModal=false;m.hidden=true;m.innerHTML='';return}
  if(ui.stack.length){ui.hDepth=Math.max(0,(ui.hDepth||0)-1);A._pop();return}
  if((ui.tab||'home')!=='home'){ui.hTab=false;ui.tab='home';window.scrollTo(0,0);render();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)A.closeModal();else if(ui.stack.length)A.back()}});
document.addEventListener('focusout',()=>{});
render();
</script>
</body>
</html>
